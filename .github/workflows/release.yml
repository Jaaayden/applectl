name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, sign and verify native archive
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG" --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applectl-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: applectl-*
          merge-multiple: true
          path: dist
      - name: Check both architectures and write checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          version = Path("VERSION").read_text().strip()
          expected = {f"applectl-{version}-macos-{arch}.tar.gz" for arch in ("arm64", "x86_64")}
          files = sorted(Path("dist").glob("*.tar.gz"))
          if {file.name for file in files} != expected:
              raise SystemExit("Both matching release architectures are required")
          lines = [hashlib.sha256(file.read_bytes()).hexdigest() + "  " + file.name for file in files]
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
      - name: Create draft, verify assets, then publish
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --draft --title "AppleCtl $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets | length' > dist/asset-count.txt
          test "$(cat dist/asset-count.txt)" = 3
          gh release edit "$RELEASE_TAG" --draft=false --latest
