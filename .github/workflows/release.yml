name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Build, sign and verify native archive
        run: python3 scripts/package_release.py --tag "$RELEASE_TAG" --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: applectl-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: applectl-*
          merge-multiple: true
          path: dist
      - name: Read the notes from the verified tag
        run: git show "$RELEASE_TAG:RELEASE_NOTES.md" > dist/RELEASE_NOTES.md
      - name: Upload draft, verify remote checksums, then publish by ID
        run: python3 scripts/publish_release.py --repo "$GH_REPO" --tag "$RELEASE_TAG" --notes dist/RELEASE_NOTES.md
