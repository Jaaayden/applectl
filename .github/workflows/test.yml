name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify release version
        run: python3 scripts/package_release.py --check-version
      - name: Swift tests (no Calendar or Reminders permissions needed)
        run: swift test
      - name: Launcher and packaging tests
        run: python3 -m unittest discover -s Tests/Python
